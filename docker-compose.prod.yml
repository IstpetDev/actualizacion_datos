# Orquestación de producción para Istpet.ActualizacionDatos (ADR-0011).
# Uso de imágenes locales construidas por el CI y cargadas por SSH sin registro.
#
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red-interna

  backend:
    image: actualizacion-datos-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Almacenamiento__RutaRaiz: /datos/archivos
      Smtp__Host: ${SMTP_HOST:-smtp.office365.com}
      Smtp__Puerto: ${SMTP_PUERTO:-587}
      Smtp__Usuario: ${SMTP_USUARIO:-}
      Smtp__Contrasenia: ${SMTP_CONTRASENIA:-}
      Smtp__Remitente: ${SMTP_REMITENTE:-}
    volumes:
      - archivos-almacenados:/datos/archivos
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red-interna

  frontend:
    image: actualizacion-datos-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red-interna

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Expuesto solo en loopback (127.0.0.1) para consumo de Cloudflare Tunnel
      - "127.0.0.1:${PUERTO_PUBLICO:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red-interna

volumes:
  postgres-datos:
  archivos-almacenados:

networks:
  red-interna:
    driver: bridge
