# Despliegue automático a producción (ADR-0011), dividido en etapas (ADR-0015).
# Se dispara únicamente al fusionar en la rama main (o por ejecución manual).
#
# construir -> transferir -> migrar -> desplegar -> verificar -> limpiar
name: Despliegue a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  DIR: ${{ vars.DEPLOY_DIR || 'C:/actualizacion_datos' }}

jobs:
  construir:
    name: Construir imagen de ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        servicio: [backend, frontend]

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construir imagen Docker
        env:
          SHA: ${{ github.sha }}
          SERVICIO: ${{ matrix.servicio }}
        run: |
          if [ "$SERVICIO" = "backend" ]; then
            docker build --pull -f src/Backend/Dockerfile -t "actualizacion-datos-${SERVICIO}:${SHA}" -t "actualizacion-datos-${SERVICIO}:latest" .
          else
            docker build --pull -t "actualizacion-datos-${SERVICIO}:${SHA}" -t "actualizacion-datos-${SERVICIO}:latest" src/Frontend
          fi

      - name: Empaquetar imagen
        env:
          SHA: ${{ github.sha }}
          SERVICIO: ${{ matrix.servicio }}
        run: |
          docker save "actualizacion-datos-${SERVICIO}:${SHA}" "actualizacion-datos-${SERVICIO}:latest" | gzip > "imagen-${SERVICIO}.tar.gz"

      - name: Publicar imagen como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagen-${{ matrix.servicio }}
          path: imagen-${{ matrix.servicio }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  transferir:
    name: Transferir imágenes y archivos al servidor
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Descargar imágenes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: imagen-*
          merge-multiple: true

      - name: Conectar al servidor
        uses: ./.github/actions/conectar-servidor
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Diagnóstico informativo: deja en el log si la VPN va directa o por relay (DERP),
      # que es la causa habitual de transferencias lentas. No detiene el despliegue.
      - name: Diagnosticar conexión con el servidor
        continue-on-error: true
        timeout-minutes: 2
        env:
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          sudo tailscale status || true
          sudo tailscale ping -c 5 "${HOST}" || true

      # Se envía el .tar.gz tal cual: docker load acepta gzip y así viajan
      # unas 3-4 veces menos datos que con la imagen descomprimida.
      - name: Transferir imágenes Docker al servidor
        timeout-minutes: 10
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          for archivo in imagen-backend.tar.gz imagen-frontend.tar.gz; do
            echo "Transfiriendo ${archivo} ($(du -h "${archivo}" | cut -f1))..."
            inicio=$(date +%s)
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" "docker load" < "${archivo}"
            echo "${archivo} cargado en $(( $(date +%s) - inicio )) s."
          done

      - name: Sincronizar archivos de orquestación
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" "powershell -Command \"New-Item -ItemType Directory -Force -Path '${DIR}/deploy/nginx' | Out-Null\""
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa docker-compose.prod.yml "${USER}@${HOST}:${DIR}/docker-compose.prod.yml"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa deploy/nginx/default.conf "${USER}@${HOST}:${DIR}/deploy/nginx/default.conf"

  migrar:
    name: Migrar base de datos
    needs: transferir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Conectar al servidor
        uses: ./.github/actions/conectar-servidor
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ejecutar migraciones de base de datos
        env:
          SHA: ${{ github.sha }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Ejecutando migraciones con flag explícito --migrar..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "cd /d ${DIR} && set TAG=${SHA}&& docker compose -f docker-compose.prod.yml run --rm backend --migrar"

      - name: Cargar y verificar catálogos versionados
        env:
          SHA: ${{ github.sha }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Cargando catálogos versionados..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "cd /d ${DIR} && set TAG=${SHA}&& docker compose -f docker-compose.prod.yml run --rm backend --cargar-catalogos"

  desplegar:
    name: Actualizar servicios en producción
    needs: migrar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Conectar al servidor
        uses: ./.github/actions/conectar-servidor
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Actualizar servicios
        env:
          SHA: ${{ github.sha }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Levantando versión ${SHA}..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "cd /d ${DIR} && set TAG=${SHA}&& docker compose -f docker-compose.prod.yml up -d --remove-orphans"

  verificar:
    name: Comprobar salud de los servicios
    needs: desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: produccion

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Conectar al servidor
        uses: ./.github/actions/conectar-servidor
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verificar salud de servicios (API y Frontend)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Esperando a que los servicios se estabilicen..."
          sleep 10
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "powershell -NoProfile -Command \"\$dir = '${DIR}'; \$envPath = \$dir + '/.env'; \$puerto = (Get-Content \$envPath -ErrorAction SilentlyContinue | Select-String '^PUERTO_PUBLICO=(\d+)' | ForEach-Object { \$_.Matches.Groups[1].Value }) | Select-Object -First 1; if (-not \$puerto) { \$puerto = if (\$env:PUERTO_PUBLICO) { \$env:PUERTO_PUBLICO } else { '8088' } }; \$saludable = \$false; \$backoffs = @(2, 4, 6, 8, 10); for (\$intento = 1; \$intento -le \$backoffs.Length; \$intento++) { Write-Host ('Intento ' + \$intento + ' de ' + \$backoffs.Length + ': comprobando API /health en puerto ' + \$puerto + '...'); curl.exe -f -s http://127.0.0.1:\$puerto/health | Out-Null; \$apiOk = (\$LASTEXITCODE -eq 0); Write-Host ('Intento ' + \$intento + ' de ' + \$backoffs.Length + ': comprobando Frontend SPA / en puerto ' + \$puerto + '...'); curl.exe -f -s -o NUL http://127.0.0.1:\$puerto/; \$frontOk = (\$LASTEXITCODE -eq 0); if (\$apiOk -and \$frontOk) { \$saludable = \$true; break; }; \$espera = \$backoffs[\$intento - 1]; Write-Host ('Servicios no listos (API: ' + \$apiOk + ', Frontend: ' + \$frontOk + '). Esperando ' + \$espera + 's antes del siguiente reintento...'); Start-Sleep -Seconds \$espera; }; if (-not \$saludable) { Write-Host 'Frontend o API no responden OK tras reintentos iniciales. Ejecutando autorrecuperacion: reiniciando frontend y proxy...'; cd /d \$dir; docker compose -f docker-compose.prod.yml restart frontend proxy; Write-Host 'Esperando 5s para estabilizacion post-reinicio...'; Start-Sleep -Seconds 5; \$backoffsReinicio = @(3, 5, 8, 10); for (\$intento = 1; \$intento -le \$backoffsReinicio.Length; \$intento++) { Write-Host ('Post-reinicio intento ' + \$intento + ' de ' + \$backoffsReinicio.Length + ': comprobando API /health...'); curl.exe -f -s http://127.0.0.1:\$puerto/health | Out-Null; \$apiOk = (\$LASTEXITCODE -eq 0); Write-Host ('Post-reinicio intento ' + \$intento + ' de ' + \$backoffsReinicio.Length + ': comprobando Frontend SPA /...'); curl.exe -f -s -o NUL http://127.0.0.1:\$puerto/; \$frontOk = (\$LASTEXITCODE -eq 0); if (\$apiOk -and \$frontOk) { \$saludable = \$true; break; }; \$espera = \$backoffsReinicio[\$intento - 1]; Write-Host ('Servicios no listos tras reinicio (API: ' + \$apiOk + ', Frontend: ' + \$frontOk + '). Esperando ' + \$espera + 's...'); Start-Sleep -Seconds \$espera; }; }; cd /d \$dir; if (\$saludable) { Write-Host 'Servicios responden OK. Despliegue verificado exitosamente.'; docker compose -f docker-compose.prod.yml ps; exit 0; } else { Write-Error 'Fallo persistente en la verificacion de salud de los servicios.'; Write-Host '=== Estado de los contenedores ==='; docker compose -f docker-compose.prod.yml ps; Write-Host '=== Logs recientes de frontend y proxy ==='; docker compose -f docker-compose.prod.yml logs --tail=50 frontend proxy; exit 1; }\""

  limpiar:
    name: Limpiar imágenes antiguas
    needs: [transferir, migrar, desplegar, verificar]
    # Corre aunque falle una etapa posterior, pero no si nunca se llegó a transferir.
    if: ${{ always() && needs.transferir.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: produccion

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Conectar al servidor
        uses: ./.github/actions/conectar-servidor
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Limpiar imágenes antiguas
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "docker image prune -f"
