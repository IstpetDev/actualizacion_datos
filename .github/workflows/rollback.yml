# Reversión manual a una versión previa en producción (ADR-0011, ADR-0031).
name: Reversión en producción

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA del commit de la imagen a desplegar (ej. a1b2c3d)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  rollback:
    name: Revertir versión en producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Conectar al servidor
        uses: ./.github/actions/conectar-servidor
        with:
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Comprobar existencia de imágenes
        env:
          TAG: ${{ inputs.tag }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Comprobando existencia de las imágenes con etiqueta ${TAG} en el servidor..."
          ssh "${USER}@${HOST}" \
            "docker image inspect actualizacion-datos-backend:${TAG} >nul && docker image inspect actualizacion-datos-frontend:${TAG} >nul"

      - name: Aplicar reversión y recrear contenedores
        env:
          TAG: ${{ inputs.tag }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DIR: ${{ vars.DEPLOY_DIR || 'C:/actualizacion_datos' }}
        run: |
          echo "Reescribiendo contenedores con la versión ${TAG}..."
          ssh "${USER}@${HOST}" \
            "cd /d ${DIR} && set TAG=${TAG}&& docker compose -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Verificación de salud (Smoke Tests)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DIR: ${{ vars.DEPLOY_DIR || 'C:/actualizacion_datos' }}
        run: |
          echo "Esperando a que los servicios se estabilicen..."
          sleep 10
          ssh "${USER}@${HOST}" \
            "powershell -Command \"\$puerto = (Get-Content '${DIR}/.env' -ErrorAction SilentlyContinue | Select-String '^PUERTO_PUBLICO=(\d+)' | ForEach-Object { \$_.Matches.Groups[1].Value }) | Select-Object -First 1; if (-not \$puerto) { \$puerto = '8088' }; Write-Host ('Comprobando API /health en puerto ' + \$puerto + '...'); curl.exe -f -s http://127.0.0.1:\$puerto/health | Out-Null; Write-Host 'API /health responde OK.'; Write-Host ('Comprobando Frontend SPA / en puerto ' + \$puerto + '...'); curl.exe -f -s http://127.0.0.1:\$puerto/ | Out-Null; Write-Host 'Frontend responde OK.'; cd /d '${DIR}'; docker compose -f docker-compose.prod.yml ps\""
