# Reversión manual a una versión previa en producción (ADR-0011).
name: Reversión en producción

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA del commit de la imagen a desplegar (ej. a1b2c3d)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  rollback:
    name: Revertir versión en producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion

    steps:
      - name: Conectar a Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar cliente SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new
            IdentityFile ~/.ssh/id_rsa
          EOF
          chmod 600 ~/.ssh/config

      - name: Comprobar existencia de imágenes
        env:
          TAG: ${{ inputs.tag }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Comprobando existencia de las imágenes con etiqueta ${TAG} en el servidor..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "docker image inspect actualizacion-datos-backend:${TAG} >nul && docker image inspect actualizacion-datos-frontend:${TAG} >nul"

      - name: Aplicar reversión y recrear contenedores
        env:
          TAG: ${{ inputs.tag }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DIR: ${{ vars.DEPLOY_DIR || 'C:/actualizacion_datos' }}
        run: |
          echo "Reescribiendo contenedores con la versión ${TAG}..."
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "cd /d ${DIR} && set TAG=${TAG}&& docker compose -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Verificación de salud (Smoke Tests)
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          DIR: ${{ vars.DEPLOY_DIR || 'C:/actualizacion_datos' }}
        run: |
          echo "Esperando 10 segundos..."
          sleep 10
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "${USER}@${HOST}" \
            "cd /d ${DIR} && powershell -NoProfile -Command \"\$p = if (\$env:PUERTO_PUBLICO) { \$env:PUERTO_PUBLICO } else { '8088' }; Write-Host 'Comprobando API en puerto '\$p; curl.exe -f -s http://127.0.0.1:\$p/health | Out-Null; if (\$LASTEXITCODE -ne 0) { Write-Error 'Fallo /health'; exit 1 }; Write-Host 'Comprobando Frontend en puerto '\$p; curl.exe -f -s -o NUL http://127.0.0.1:\$p/; if (\$LASTEXITCODE -ne 0) { Write-Error 'Fallo Frontend'; exit 1 }; Write-Host 'Servicios respondiendo exitosamente.'\""
