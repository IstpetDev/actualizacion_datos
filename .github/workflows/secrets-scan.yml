# Escaneo de secretos con gitleaks. Lo llama ci.yml: en PR a develop revisa
# solo los commits del PR; en PR a main, push a main y ejecución semanal,
# todo el historial. Se usa el binario oficial verificado por checksum (la
# acción oficial pide licencia de pago en cuentas de organización).
name: Escaneo de secretos

on:
  workflow_call:
    inputs:
      completo:
        description: Escanear todo el historial en lugar de solo los cambios.
        type: boolean
        required: true
      ref:
        description: Ref a escanear (vacío = la del evento).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archivo"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archivo" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Escanear
        env:
          COMPLETO: ${{ inputs.completo }}
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
        run: |
          opciones=(git --config .gitleaks.toml --redact --no-banner --exit-code 1)
          if [ "$COMPLETO" = "true" ]; then
            echo "Escaneando todo el historial."
          elif [ "$EVENTO" = "pull_request" ]; then
            echo "Escaneando los commits del PR: $BASE_SHA..$HEAD_SHA"
            opciones+=("--log-opts=$BASE_SHA..$HEAD_SHA")
          elif [ "$EVENTO" = "push" ] && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            echo "Escaneando los commits del push: $ANTES..$DESPUES"
            opciones+=("--log-opts=$ANTES..$DESPUES")
          else
            echo "Sin rango conocido: escaneando todo el historial."
          fi
          gitleaks "${opciones[@]}" .
